services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: humanoid-lab-dev
    working_dir: /workspace
    tty: true
    stdin_open: true
    volumes:
      - ..:/workspace:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      DEBIAN_FRONTEND: noninteractive
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: 1
      ROS_DOMAIN_ID: 0
    command: bash
